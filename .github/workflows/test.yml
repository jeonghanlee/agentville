name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # The 0.3.0 upgrade check archives the published 0.3.0 writer by commit, so it needs the full history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[hq,test]'
      - run: python -m pytest -q

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[hq,test,browser]'
      - run: python -m playwright install --with-deps chromium
      - name: Browser tests, failing instead of skipping without Playwright
        env:
          AGENTVILLE_REQUIRE_BROWSER: "1"
        run: python -m pytest -q tests/browser

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run install.sh against this commit
        env:
          AGENTVILLE_REPO: ${{ github.workspace }}
        run: ./install.sh --hq --no-start --ref "$GITHUB_SHA"
      - run: ~/.local/bin/agentville-hq --version && ~/.local/bin/agentville-collector --version
