[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentville"
version = "0.0.1"
description = "An open virtual world for AI agents."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "jsonschema>=4",
]

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
pythonpath = ["packages"]
testpaths = ["tests"]
