[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentville"
version = "0.1.0"
description = "A self-hosted, read-only virtual office for AI coding agents (Claude Code, Codex)."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
hq = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "jsonschema>=4",
]
test = [
    "pytest>=8",
    "jsonschema>=4",
    "httpx>=0.27",
]

[project.scripts]
agentville-collector = "agentville.collector.main:main"
agentville-hq = "agentville.hq.main:main"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.setuptools.package-data]
"agentville.common" = ["schemas/*.json"]
"agentville.hq" = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["packages"]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
