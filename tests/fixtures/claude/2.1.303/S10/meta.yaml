provider: claude
version: 2.1.303
scenario: S10
title: Two concurrent agents in one repository, one in tmux; seats return by runtime location
expect:
- {seat: 1, ref: a, location: null, presence: on_duty, after: 1}
- {seat: 2, ref: b, location: 'agents:@1.%1', presence: on_duty, after: 2}
- {seat: 1, state: working, after: 4}
- {seat: 2, state: idle, after: 4}
- {seat: 1, state: working, tool: null, after: 7}
- {seat: 2, state: working, tool: Bash, after: 7}
- {seat: 1, presence: off_duty, same_as: a, after: 8}
- {seat: 2, presence: off_duty, same_as: b, after: 9}
- {pid: 1003, seat: 2, same_as: b, presence: on_duty, after: 10}
- {pid: 1004, seat: 1, same_as: a, presence: on_duty, after: 11}
- {agent_count: 2, after: 11}
